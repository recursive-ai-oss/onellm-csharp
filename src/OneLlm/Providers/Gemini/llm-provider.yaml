# Gemini API models: limits, capabilities, thinking settings and prices.
# Limits: https://ai.google.dev/gemini-api/docs/models (each model's page). Prices: https://ai.google.dev/gemini-api/docs/pricing, Standard tier,
# paid, US dollars per million tokens, text/image/video input rate (audio is listed separately where the page lists a different rate).
# Prices that the pricing page says change on a date are noted in the model's properties.scheduledPriceChange.
name: gemini
displayName: Google Gemini

modelPatterns:
  - "gemini-*"

aliases:
  gemini: gemini-3.8-flash
  gemini-default: gemini-3.8-flash
  gemini-fast: gemini-3.8-flash
  gemini-flash: gemini-3.8-flash
  gemini-lite: gemini-3.5-flash-lite
  gemini-flash-lite: gemini-3.5-flash-lite
  gemini-pro: gemini-3.1-pro-preview
  gemini-smart: gemini-4-argon
  gemini-4: gemini-4-argon
  gemini-argon: gemini-4-argon
  gemini-embedding: gemini-embedding-2

apiKeyEnvVar: GEMINI_API_KEY

capabilities:
  streaming: true
  # Implicit caching is on by default for Gemini 2.5 and newer; hits are reported as cachedContentTokenCount. Explicit caches use cachedContents.
  promptCaching: true
  imageInputs: true
  imageToolResults: true
  tools: true
  structuredOutput: true
  batch: true
  embeddings: true
  tokenCounting: true

models:
  - name: gemini-4-argon
    displayName: Gemini 4 Argon
    family: gemini-4-argon
    contextWindow: 1048576
    maxOutputTokens: 32768
    supportsCaching: true
    supportsVision: true
    supportsTools: true
    supportsStructuredOutput: true
    supportsAudioInput: true
    supportsPdfInput: true
    supportsVideoInput: true
    # Sampling parameters are no longer supported and are ignored by the service from Gemini 3.6 Flash on (generate-content reference).
    supportsTemperature: false
    # The service rejects thinkingLevel MINIMAL on this model; thinking cannot be switched off.
    thinking:
      efforts: [low, medium, high]
      defaultEffort: medium
      acceptsBudget: false
    serviceTiers:
      flex:
        pricingMultiplier: 0.5
      priority:
        pricingMultiplier: 1.8
    pricing:
      inputPerMillion: 2.00
      outputPerMillion: 10.00
      cacheReadPerMillion: 0.10
      asOf: "2026-11-05"
      source: https://ai.google.dev/gemini-api/docs/pricing
      items:
      - counter: toolCalls.google_search
        price: 14
        per: 1000
        label: "Grounding with Google Search, per search query"
      - counter: toolCalls.google_maps
        price: 14
        per: 1000
        label: "Grounding with Google Maps, per query"
      - counter: cacheStorageTokenHours
        price: 0.5
        per: 1000000
        label: "explicit cache storage, per million tokens per hour"
      multipliers:
        batch: 0.5
    properties:
      scheduledPriceChange: "From 2026-12-01 input 4.00, output 20.00 per million tokens, cache read 0.20."
      longDecodeMaxOutputTokens: 1048576

  - name: gemini-3.8-flash
    displayName: Gemini 3.8 Flash
    family: gemini-3.8-flash
    contextWindow: 1048576
    maxOutputTokens: 65536
    supportsCaching: true
    supportsVision: true
    supportsTools: true
    supportsStructuredOutput: true
    supportsAudioInput: true
    supportsPdfInput: true
    supportsVideoInput: true
    # Sampling parameters are no longer supported and are ignored by the service from Gemini 3.6 Flash on (generate-content reference).
    supportsTemperature: false
    # The service rejects thinkingLevel MINIMAL on this model; thinking cannot be switched off.
    thinking:
      efforts: [low, medium, high]
      defaultEffort: medium
      acceptsBudget: false
    serviceTiers:
      flex:
        pricingMultiplier: 0.5
      priority:
        pricingMultiplier: 1.8
    pricing:
      inputPerMillion: 0.75
      outputPerMillion: 3.75
      cacheReadPerMillion: 0.075
