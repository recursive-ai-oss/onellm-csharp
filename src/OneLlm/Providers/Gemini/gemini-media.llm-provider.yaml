  - name: gemini-3.8-flash-tts
    displayName: Gemini 3.8 Flash TTS
    kind: speech
    pricing:
      inputPerMillion: 0.5
      asOf: "2026-11-05"
      source: https://ai.google.dev/gemini-api/docs/pricing
      items:
        - counter: outputAudioTokens
          price: 9
          label: audio output
          asOf: "2026-11-05"
          source: https://ai.google.dev/gemini-api/docs/pricing
      multipliers:
        batch: 0.5
    properties:
      speechMetadata: true
      scheduledPriceChange: "From 2027-01-01 input 1.00, output (audio) 18.00 per million tokens."
  - name: gemini-3.8-flash-lite-tts
