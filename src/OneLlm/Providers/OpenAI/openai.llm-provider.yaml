# OpenAI models and prices. Prices are US dollars per million tokens unless an item says otherwise.
# Read from https://developers.openai.com/api/docs/pricing and the per-model pages under https://developers.openai.com/api/docs/models/ on 2026-11-05.
name: openai
displayName: OpenAI
apiKeyEnvVar: OPENAI_API_KEY
modelPatterns: ["gpt-*", "o3*", "chatgpt-*", "text-embedding-*"]
aliases:
  embedding-small: text-embedding-3-small
  embedding-large: text-embedding-3-large
capabilities:
  streaming: true
  promptCaching: true
  imageInputs: true
  imageToolResults: true
  tools: true
  structuredOutput: true
  batch: true
  embeddings: true
  tokenCounting: true
models:
  - name: gpt-6-astra
    displayName: GPT-6 Astra
    kind: chat
    contextWindow: 1050000
    maxOutputTokens: 128000
    supportsCaching: true
    supportsVision: true
    supportsTools: true
    supportsTemperature: false
    supportsStructuredOutput: true
    supportsPdfInput: true
    serviceTiers:
      flex:
        pricingMultiplier: 0.5
      priority:
        pricingMultiplier: 2
    thinking:
      efforts: [low, medium, high, xhigh, max]
      acceptsBudget: false
    properties:
      maxInputTokens: 922000
      promptCacheOptions: true
      chatCompletionsTools: false
    pricing:
      inputPerMillion: 10
      outputPerMillion: 50
      cacheReadPerMillion: 1
      cacheCreationPerMillion: 12.5
      asOf: "2026-11-05"
      source: https://developers.openai.com/api/docs/pricing
      items:
        - counter: cacheCreation12hInputTokens
          price: 25
          per: 1000000
          label: 12h cache write
          asOf: "2026-11-05"
          source: https://developers.openai.com/api/docs/pricing
        - counter: toolCalls.web_search
          price: 10
          per: 1000
          label: web search
          asOf: "2026-11-05"
          source: https://developers.openai.com/api/docs/pricing
        - counter: toolCalls.file_search
          price: 2.5
          per: 1000
          label: file search
          asOf: "2026-11-05"
          source: https://developers.openai.com/api/docs/pricing
      tiers:
        - above: 272000
          multipliers: { inputTokens: 2, cacheReadInputTokens: 2, cacheCreationInputTokens: 2, outputTokens: 1.5, cacheCreation12hInputTokens: 2 }
          label: long context
      multipliers:
        batch: 0.5
