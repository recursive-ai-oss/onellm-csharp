# Anthropic models, limits, thinking settings and prices.
# Prices: USD per million tokens, from the Anthropic pricing page (see each model's source and asOf).
# Usage fields: cacheCreationInputTokens is the total of all cache writes as the API reports it; cacheCreation1hInputTokens is the part
# of it written with the 1-hour lifetime and is priced by the item below; the rest is priced at cacheCreationPerMillion (5 minutes).
name: anthropic
displayName: Anthropic
modelPatterns:
  - "claude-*"
aliases:
  claude-fable: claude-fable-5-1
  claude-mythos: claude-mythos-5-1
  claude-opus: claude-opus-5-5
  claude-sonnet: claude-sonnet-5-5
  claude-haiku: claude-haiku-5-5
  claude-opus-4-5: claude-opus-4-5-20251101
  claude-sonnet-4-5: claude-sonnet-4-5-20250929
  claude-haiku-4-5: claude-haiku-4-5-20251001
apiKeyEnvVar: ANTHROPIC_API_KEY
capabilities:
  streaming: true
  promptCaching: true
  imageInputs: true
  imageToolResults: true
  tools: true
  structuredOutput: true
  batch: true
  tokenCounting: true
models:
  - name: claude-fable-5-1
    displayName: Claude Fable 5.1
    family: fable
    contextWindow: 1000000
    maxOutputTokens: 128000
    supportsCaching: true
    supportsVision: true
    supportsTools: true
    supportsTemperature: false
    supportsStructuredOutput: true
    supportsPdfInput: true
    manyImageThreshold: 20
    manyImageMaxDimension: 3000
    thinking:
      efforts: [low, medium, high, xhigh, max]
      defaultEffort: high
      acceptsBudget: false
    properties:
      adaptiveThinking: true
      maxImageLongEdge: 2576
      maxImageBytes: 10485760
    pricing:
      inputPerMillion: 10
      outputPerMillion: 50
      cacheCreationPerMillion: 12.50
      cacheReadPerMillion: 0.25
      asOf: 2026-11-05
      source: https://platform.claude.com/docs/en/about-claude/pricing
      items:
        - counter: cacheCreation1hInputTokens
          price: 20
          label: 1-hour cache write
        - counter: toolCalls.web_search
          price: 10
          per: 1000
          label: web search
      multipliers:
        batch: 0.5
        "region:us": 1.1
