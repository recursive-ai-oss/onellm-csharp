# Gemini media models: image generation and text to speech through generateContent.
# Prices: https://ai.google.dev/gemini-api/docs/pricing, Standard tier, paid, US dollars per million tokens, read on 2026-11-05.
# Image models bill image output tokens at their own rate (outputImageTokens); the text and thinking output rate is outputPerMillion. Speech models bill
# audio output tokens (outputAudioTokens, 25 tokens per second of audio). A price the page says will change on a date is noted in properties.scheduledPriceChange.
name: gemini
capabilities:
  imageGeneration: true
  textToSpeech: true
models:
  - name: gemini-nano-banana-2.1
    displayName: Gemini Nano Banana 2.1
    kind: image
    pricing:
      inputPerMillion: 1.5
      outputPerMillion: 7.5
      asOf: "2026-11-05"
      source: https://ai.google.dev/gemini-api/docs/pricing
      items:
        - counter: outputImageTokens
          price: 30
          label: image output
          asOf: "2026-11-05"
          source: https://ai.google.dev/gemini-api/docs/pricing
      multipliers:
        batch: 0.5
    properties:
      maxImages: 8
  - name: gemini-3.1-flash-image
    displayName: Gemini 3.1 Flash Image (Nano Banana 2)
    kind: image
    pricing:
      inputPerMillion: 0.5
      outputPerMillion: 3
      asOf: "2026-11-05"
      source: https://ai.google.dev/gemini-api/docs/pricing
      items:
        - counter: outputImageTokens
          price: 60
          label: image output
          asOf: "2026-11-05"
          source: https://ai.google.dev/gemini-api/docs/pricing
    properties:
      maxImages: 8
  - name: gemini-3.1-flash-lite-image
    displayName: Gemini 3.1 Flash Lite Image (Nano Banana 2 Lite)
    kind: image
    pricing:
      inputPerMillion: 0.25
      outputPerMillion: 1.5
      asOf: "2026-11-05"
      source: https://ai.google.dev/gemini-api/docs/pricing
      items:
