    # Budget-driven; thinking cannot be switched off. The effort dynamic sends the budget -1, which lets the model decide.
    thinking:
      efforts: [low, medium, high, dynamic]
      defaultEffort: dynamic
      acceptsBudget: true
      defaultEffortBudgets:
        low: 2000
        medium: 8000
        high: 24000
      minBudget: 128
      maxBudget: 32768
