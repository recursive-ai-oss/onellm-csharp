      inputPerMillion: 2
      outputPerMillion: 12
      asOf: "2026-11-05"
      source: https://ai.google.dev/gemini-api/docs/pricing
      items:
        - counter: outputImageTokens
          price: 120
          label: image output
          asOf: "2026-11-05"
          source: https://ai.google.dev/gemini-api/docs/pricing
