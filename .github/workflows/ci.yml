name: ci

on:
  push:
    branches: ['ci-check/**']
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: Runner to build and test on (all runs the full matrix)
        type: choice
        default: all
        options: [all, windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.os != 'all') && format('["{0}"]', inputs.os) || '["windows-latest","ubuntu-latest","ubuntu-24.04-arm","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Runtime identifier
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Windows-X64) rid=win-x64 ;;
            Linux-X64) rid=linux-x64 ;;
            Linux-ARM64) rid=linux-arm64 ;;
            macOS-ARM64) rid=osx-arm64 ;;
            *) echo "unexpected runner $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          echo "RID=$rid" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build output goes outside the checkout, as it does locally; the runner context is only available inside steps.
      - name: Artifacts directory
        shell: bash
        run: echo "ONELLM_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build OneLlm.slnx -c Release
      - name: Test
        run: dotnet test --solution OneLlm.slnx -c Release --no-build
      - name: Native AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Publish AOT smoke app (warnings are errors)
        run: dotnet publish samples/AotSmoke -c Release -r ${{ env.RID }} -o ${{ runner.temp }}/smoke -warnaserror
      - name: Run AOT smoke app
        shell: bash
        run: '"$RUNNER_TEMP/smoke/AotSmoke"'

  pack:
    # Builds the packages as an artifact only; nothing is pushed anywhere.
    if: github.event_name != 'workflow_dispatch' || inputs.os == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts directory
        shell: bash
        run: echo "ONELLM_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Pack
        run: dotnet pack OneLlm.slnx -c Release -o ${{ runner.temp }}/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*
