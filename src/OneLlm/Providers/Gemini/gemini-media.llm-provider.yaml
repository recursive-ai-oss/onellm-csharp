          price: 30
          label: image output
          asOf: "2026-11-05"
          source: https://ai.google.dev/gemini-api/docs/pricing
      multipliers:
        batch: 0.5
    properties:
      maxImages: 8
  - name: gemini-3-pro-image
    displayName: Gemini 3 Pro Image (Nano Banana Pro)
    kind: image
