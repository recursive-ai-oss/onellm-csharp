# OpenAI media models: image generation and editing, speech, transcription and moderation.
# Prices are US dollars per million tokens unless an item says otherwise, read from https://developers.openai.com/api/docs/pricing on 2026-11-05
# (sections "Image generation models", "Text to speech", "Transcription models" and the moderation row).
#
# How media usage is priced here:
#  - Image models bill tokens. inputPerMillion is the text input rate, outputPerMillion the text output rate where the model has one; image input and
#    image output tokens are priced by the inputImageTokens and outputImageTokens items, which the pricing engine takes out of the token totals.
#  - tts-1 and tts-1-hd bill per character of input (counter "characters"). gpt-4o-mini-tts bills tokens, but the speech endpoint reports no usage.
#  - whisper-1 and gpt-transcribe bill audio minutes (counter "audioSeconds", priced per second). The gpt-4o transcribe models bill tokens; their
#    per-minute figure on the page is an estimate and is kept as a second item for responses that report duration instead of tokens.
#  - Moderation is free.
name: openai
capabilities:
  imageGeneration: true
  textToSpeech: true
  speechToText: true
  moderation: true
models:
  - name: gpt-image-2.6-sunburst
    displayName: GPT Image 2.6 Sunburst
    kind: image
    pricing:
      inputPerMillion: 5
      cacheReadPerMillion: 1.25
      asOf: "2026-11-05"
      source: https://developers.openai.com/api/docs/pricing
      items:
        - counter: inputImageTokens
          price: 8
          label: image input
          asOf: "2026-11-05"
          source: https://developers.openai.com/api/docs/pricing
        - counter: outputImageTokens
          price: 30
          label: image output
          asOf: "2026-11-05"
          source: https://developers.openai.com/api/docs/pricing
    properties:
      maxImages: 10
      edits: true
